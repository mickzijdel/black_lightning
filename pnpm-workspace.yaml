allowBuilds:
  "@parcel/watcher": true

# Transitive-dependency patch bumps for advisories pnpm audit flags in dev-only subtrees
# (eslint's minimatch, and vite's postcss). Remove an entry once the parent package's own
# lockfile pulls in a version at/above the patched floor on its own.
overrides:
  brace-expansion@>=4.0.0 <5.0.9: ">=5.0.9"
  nanoid@<3.3.18: ">=3.3.18"
